[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xmake-luals-addon"
version = "0.1.0"
description = "Generate LuaLS annotations for xmake from its documentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
xmake-luals = "xmake_luals.cli:main"

[tool.setuptools]
packages = ["xmake_luals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
